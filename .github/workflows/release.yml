name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build, sign and notarize Exo's disk image
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1.343.0
        with:
          bundler-cache: true

      - name: Build, sign and notarize
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bundle exec fastlane release

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Exo
          retention-days: 14
          if-no-files-found: error
          path: |
            target/release/exo-v*-macos-arm64.dmg
            target/release/checksums.txt

  attach:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Exo
          path: dist

      - name: Attach Exo's disk image and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.dmg dist/checksums.txt
