[package]
name = "exo"
description = "Exo, a keyboard-driven Gmail client for macOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
arboard = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
exo-auth = { workspace = true }
exo-commands = { workspace = true }
exo-editor = { workspace = true }
exo-mail = { workspace = true }
exo-store = { workspace = true }
exo-ui = { workspace = true }
fastframe-autostart = { workspace = true }
fastframe-dirs = { workspace = true }
fastframe-file = { workspace = true }
fastframe-log = { workspace = true }
env_logger = { workspace = true }
fastframe-graphics = { workspace = true }
flate2 = { workspace = true }
fastframe-instance = { workspace = true }
fastframe-notifications = { workspace = true }
fastframe-shell = { workspace = true }
fastframe-titlebar = { workspace = true }
fastframe-update = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
gmail = { workspace = true }
html5ever = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
jiff = { workspace = true }
log = { workspace = true }
markup5ever_rcdom = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
mail-parser = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
unicode-normalization = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
dispatch2 = { workspace = true }
libc = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = [
    "NSAlert",
    "NSApplication",
    "NSAttributedString",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSDockTile",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSFilePromiseProvider",
    "NSFont",
    "NSGraphicsContext",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSSpellChecker",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "block2",
] }
objc2-foundation = { workspace = true, features = [
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSOrthography",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTextCheckingResult",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSUserDefaults",
] }
objc2-web-kit = { workspace = true, features = [
    "WKContentWorld",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKURLSchemeHandler",
    "WKURLSchemeTask",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebpagePreferences",
    "WKWebsiteDataStore",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
] }
objc2-quick-look-ui = { workspace = true, features = [
    "QLPreviewItem",
    "QLPreviewPanel",
    "objc2-app-kit",
] }
objc2-core-foundation = { workspace = true, features = ["CFString"] }
objc2-system-configuration = { workspace = true }
winit = { workspace = true }
objc2-map-kit = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
gmail-mock = { workspace = true }
rusqlite = { workspace = true }
toasty = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
